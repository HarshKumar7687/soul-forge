# Usage: copy .env.example to .env, set JWT_SECRET and your AI keys, then: docker compose up --build
# Open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/soulforge
      # Must equal the address people open in the browser (CORS and cross-site write protection)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PORT: "4000"
    depends_on: [mongo]
    volumes: [uploads:/app/uploads]

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  mongo-data:
  uploads:
